<app-navigation
  id="dashboard-sidebar"
  class="coded-navbar  pc-sidebar pc-sidebar-{{ 'dir' | translate }}"
  [ngClass]="{
    'navbar-collapsed': navCollapsed,
    'mob-open': navCollapsedMob
  }"
  (NavCollapsedMob)="closeMenu()"
  [attr.inert]="(windowWidth <= 1024 ? !navCollapsedMob : navCollapsed) ? '' : null"
  [attr.aria-hidden]="(windowWidth <= 1024 ? !navCollapsedMob : navCollapsed) ? 'true' : null"
  [dir]="'dir' | translate"
></app-navigation>
<app-nav-bar
  [attr.inert]="windowWidth <= 1024 && navCollapsedMob ? '' : null"
  [mobileMenuOpen]="navCollapsedMob"
  [navCollapsed]="navCollapsed"
  [dir]="'dir' | translate"
  (NavCollapse)="this.navCollapsed = !this.navCollapsed"
  (NavCollapsedMob)="navMobClick()"
></app-nav-bar>
<div class="pc-container" [dir]="'dir' | translate">
  <div class="coded-wrapper" [attr.inert]="windowWidth <= 1024 && navCollapsedMob ? '' : null" [dir]="'dir' | translate">
    <div class="coded-content" [dir]="'dir' | translate">
      <div class="coded-inner-content" [dir]="'dir' | translate">
        <div class="main-body" [dir]="'dir' | translate">
          <div class="page-wrapper" [dir]="'dir' | translate">
            <router-outlet></router-outlet>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div
    class="pc-menu-overlay"
    role="button"
    [attr.aria-label]="'RESPONSIVE.MENU_CLOSE' | translate"
    (click)="closeMenu()"
    (keydown)="handleKeyDown($event)"
    [attr.tabindex]="navCollapsedMob ? 0 : -1"
    [attr.aria-hidden]="!navCollapsedMob"
  ></div>
</div>
<footer class="pc-footer" [dir]="'dir' | translate" [attr.inert]="windowWidth <= 1024 && navCollapsedMob ? '' : null">
  <div class="footer-wrapper container-fluid">
    <div class="row">
      <div class="col my-1">
        <p class="m-0">
          Copyright &copy;
          <a href="#">Trips 2025</a>
        </p>
      </div>
    </div>
  </div>
</footer>
<ngx-spinner bdColor="rgba(0, 0, 0, 0.8)" size="medium" color="#fff" type="ball-grid-pulse" [fullScreen]="true">
  <p style="color: white">Loading...</p>
</ngx-spinner>
