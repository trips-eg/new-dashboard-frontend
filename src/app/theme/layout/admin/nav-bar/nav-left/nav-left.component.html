<div class="nav-left-content">
  <div class="pc-h-item header-mobile-collapse">
    <button
      type="button"
      class="pc-head-link mobile-menu"
      id="mobile-collapse"
      (click)="NavCollapsedMob.emit()"
      [attr.aria-label]="'RESPONSIVE.MENU' | translate"
      aria-controls="dashboard-sidebar"
      [attr.aria-expanded]="mobileMenuOpen"
    >
      <i class="ti ti-menu-2" aria-hidden="true"></i>
    </button>
    <a routerLink="/default" class="brand-link mobile-brand" [attr.aria-label]="'NAV_UI.HOME' | translate">
      <img src="assets/images/new logo.PNG" alt="" width="36" height="36" class="brand-mark" />
      <strong>Trips</strong>
    </a>
  </div>
  <button *ngIf="showBack" type="button" class="pc-head-link header-back" (click)="goBack()" [attr.aria-label]="'APP.back' | translate" [title]="'APP.back' | translate">
    <i class="ti ti-arrow-right" aria-hidden="true"></i>
  </button>
  <span class="workspace-label">{{ 'NAV_UI.WORKSPACE' | translate }}</span>
</div>
