<div class="nav-right-content">
  <!-- The Trips Partners app (the TRIPS Staff app on Google Play) -->
  <div class="pc-h-item">
    <a
      class="pc-head-link app-download-control"
      href="https://play.google.com/store/apps/details?id=eg.trips.staff.trips_staff"
      target="_blank"
      rel="noopener"
      [attr.aria-label]="'NAV_UI.DOWNLOAD_APP' | translate"
      [title]="'NAV_UI.DOWNLOAD_APP' | translate"
    >
      <i class="ti ti-brand-google-play" aria-hidden="true"></i>
      <span class="app-download-label">{{ 'NAV_UI.DOWNLOAD_APP' | translate }}</span>
    </a>
  </div>
  <div class="pc-h-item">
    <button
      type="button"
      class="pc-head-link language-control"
      (click)="changeLanguage(currentLang === 'ar' ? 'en' : 'ar')"
      [attr.aria-label]="('RESPONSIVE.LANGUAGE' | translate) + ': ' + (currentLang === 'ar' ? 'English' : 'العربية')"
    >
      <i class="ti ti-world" aria-hidden="true"></i>
      <span>{{ currentLang === 'ar' ? 'EN' : 'AR' }}</span>
    </button>
  </div>
  <div class="dropdown pc-h-item header-user-profile" ngbDropdown>
    <button
      type="button"
      class="pc-head-link profile-control dropdown-toggle"
      ngbDropdownToggle
      [attr.aria-label]="('RESPONSIVE.PROFILE' | translate) + ': ' + username"
    >
      <span class="profile-avatar" aria-hidden="true">{{ initials }}</span>
      <span class="header-username">{{ username }}</span>
      <i class="ti ti-chevron-down profile-chevron" aria-hidden="true"></i>
    </button>
    <div class="dropdown-menu dropdown-user-profile dropdown-menu-end pc-h-dropdown" ngbDropdownMenu>
      <div class="profile-summary">
        <span class="profile-welcome">{{ 'NAV_UI.WELCOME' | translate }}</span>
        <strong>{{ username }}</strong>
        <span class="profile-role" *ngIf="userRole?.length">{{ roleLabels }}</span>
        <span class="profile-email" *ngIf="userEmail">{{ userEmail }}</span>
      </div>
      <div class="profile-actions">
        <a [routerLink]="['/vendor-details', vendorId]" class="dropdown-item" ngbDropdownItem *ngIf="isVendor()">
          <i class="ti ti-user" aria-hidden="true"></i>
          <span>{{ 'NAV_UI.PROFILE' | translate }}</span>
        </a>
        <button type="button" class="dropdown-item" ngbDropdownItem (click)="checkForUpdates()">
          <i class="ti ti-refresh" aria-hidden="true"></i>
          <span>{{ 'NAV_UI.CHECK_UPDATES' | translate }}</span>
        </button>
        <button type="button" class="dropdown-item logout-action" ngbDropdownItem (click)="logout()">
          <i class="ti ti-logout" aria-hidden="true"></i>
          <span>{{ 'NAV_UI.LOGOUT' | translate }}</span>
        </button>
      </div>
    </div>
  </div>
</div>
