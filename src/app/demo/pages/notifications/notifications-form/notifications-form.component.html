<form [formGroup]="form" (ngSubmit)="save()" class="p-fluid grid pl-5 pr-5">
  <div class="field col-12">
    <label for="title">Title</label>
    <input pInputText id="title" formControlName="title" placeholder="Enter title" />
    <small class="p-error" *ngIf="form.get('title')?.touched && form.get('title')?.invalid">Title is required</small>
  </div>

  <div class="field col-12">
    <label for="body">Message Body</label>
    <textarea pInputTextarea id="body" formControlName="body" rows="3" placeholder="Enter message"></textarea>
    <small class="p-error" *ngIf="form.get('body')?.touched && form.get('body')?.invalid">Message body is required</small>
  </div>

  <!-- The item the notification opens in the app, and title/body ideas (phase 5) -->
  <ng-container *ngIf="mode === 'Add'">
    <div class="field col-12 md:col-6">
      <label for="itemType">يفتح إيه في الأبلكيشن</label>
      <p-dropdown
        id="itemType"
        [options]="itemTypes"
        formControlName="itemType"
        optionLabel="label"
        optionValue="value"
        (onChange)="onItemTypeChange($event.value)"
      ></p-dropdown>
    </div>
    <div class="field col-12 md:col-6" *ngIf="form.get('itemType')?.value">
      <label for="itemId">اختار</label>
      <p-dropdown
        id="itemId"
        [options]="(itemOptions$ | async) ?? []"
        formControlName="itemId"
        optionLabel="label"
        optionValue="value"
        [filter]="true"
        placeholder="اختار من القايمة"
      ></p-dropdown>
    </div>

    <div class="field col-12">
      <button
        pButton
        type="button"
        icon="pi pi-sparkles"
        class="p-button-outlined"
        label="اقترح عنوان ونص"
        [loading]="suggesting"
        (click)="suggest()"
      ></button>
      <small class="block mt-1 text-600">
        بيكتب اقتراحات من المكان اللي اخترته واليوم (زي الويك اند). لو كاتب فكرة في العنوان، بياخدها في الاعتبار. اضغط على اقتراح عشان يتحط في العنوان والنص.
      </small>
      <div class="grid mt-2" *ngIf="suggestions.length">
        <div class="col-12 md:col-6" *ngFor="let s of suggestions">
          <div class="surface-border border-1 border-round p-2 cursor-pointer hover:surface-100" (click)="useSuggestion(s)">
            <div class="font-bold">
              {{ s.title }}
              <span class="text-xs text-primary" *ngIf="s.source === 'ai'">AI</span>
            </div>
            <div class="text-600 text-sm">{{ s.body }}</div>
          </div>
        </div>
      </div>
    </div>
  </ng-container>

  <div class="field col-12" *ngIf="mode === 'Add'">
    <label>User Type</label>
    <div class="flex gap-3 mt-2">
      <div class="flex align-items-center">
        <p-checkbox formControlName="LoginUser" [binary]="true" inputId="loginUser"></p-checkbox>
        <label for="loginUser" class="ml-2">Login User</label>
      </div>
      <div class="flex align-items-center">
        <p-checkbox formControlName="Anonymous" [binary]="true" inputId="anonymous"></p-checkbox>
        <label for="anonymous" class="ml-2">Anonymous</label>
      </div>
    </div>
  </div>

  <div class="field col-12" *ngIf="form.get('LoginUser')?.value === true || mode === 'Edit'">
    <label for="usersId">Select Users</label>
    <p-multiSelect
      *ngIf="mode === 'Add'"
      id="usersId"
      [options]="users"
      formControlName="usersId"
      optionLabel="name"
      optionValue="id"
      placeholder="Select Users"
      [filter]="true"
      display="chip"
      [showClear]="true"
      [virtualScroll]="true"
      [virtualScrollItemSize]="40"
      (onFilter)="onFilterUsers($event)"
      [loading]="usersLoading"
      scrollHeight="250px"
    ></p-multiSelect>

    <p-dropdown
      *ngIf="mode === 'Edit'"
      id="usersId"
      [options]="users"
      formControlName="usersId"
      optionLabel="name"
      optionValue="id"
      placeholder="Select User"
      [filter]="true"
      [showClear]="true"
      [virtualScroll]="true"
      [virtualScrollItemSize]="40"
      [lazy]="true"
      (onFilter)="onFilterUsers($event)"
      [loading]="usersLoading"
      scrollHeight="250px"
    ></p-dropdown>

    <small class="p-error" *ngIf="form.get('usersId')?.touched && form.get('usersId')?.invalid">At least one User ID is required</small>
  </div>

  <div class="field col-12">
    <label for="image">Image</label>
    <div class="">
      <app-img-uploader [multiple]="false" [displayFile]="displayFile" (filesChanged)="onFileSelect($event)"></app-img-uploader>
    </div>
  </div>

  <div class="col-12 flex justify-content-end gap-2 mt-3 mb-3">
    <button pButton type="button" label="Cancel" class="p-button-secondary p-button-text" (click)="close()"></button>
    <button pButton type="submit" label="Send Notification" [loading]="loading" [disabled]="form.invalid || loading"></button>
  </div>
</form>
