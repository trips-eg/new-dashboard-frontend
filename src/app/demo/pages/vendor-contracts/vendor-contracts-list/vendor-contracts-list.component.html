<!-- sales-agencies-list.component.html -->
<div class="card">
  <p-toolbar>
    <ng-template pTemplate="right">
      <span class="p-input-icon-left">
        <i class="pi pi-search"></i>
        <input pInputText type="text" [(ngModel)]="filterMap.Search" (input)="onSearch()" placeholder="{{ 'search' | translate }}" />
      </span>
    </ng-template>
  </p-toolbar>

  <p-table
    [value]="VendorContracts"
    [paginator]="true"
    [rows]="filterMap.pageSize"
    [totalRecords]="totalRecords"
    [lazy]="true"
    (onLazyLoad)="onPageChange($event)"
    [loading]="loading"
    [rowsPerPageOptions]="[10, 20, 50]"
    [first]="(filterMap.pageIndex - 1) * filterMap.pageSize"
    [showCurrentPageReport]="true"
    [currentPageReportTemplate]="'showingEntries' | translate"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>{{ 'name' | translate }}</th>
        <th>{{ 'email' | translate }}</th>
        <th>{{ 'phone' | translate }}</th>
        <th>{{ 'vendor status' | translate }}</th>
        <th>{{ 'address' | translate }}</th>
        <th></th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-agency>
      <tr>
        <td>{{ agency.name }}</td>
        <td>{{ agency.email }}</td>
        <td>{{ agency.phone }}</td>
        <td >{{ getStatusName(agency?.vendorStatus)}}</td>
        <td style="max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ agency.addresss }}</td>
        <td>
          <div class="flex gap-1 justify-content-center">
            <p-button
              [raised]="true"
              icon="pi pi-eye"
              severity="info"
              [rounded]="true"
              [routerLink]="['/Vendor-Contract-details', agency.id]"
            ></p-button>
            <!-- <p-button icon="pi pi-trash" severity="danger" [rounded]="true" (click)="onDelete(agency.id)"></p-button> -->
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
<p-confirmDialog></p-confirmDialog>
